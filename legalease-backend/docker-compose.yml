services:
  postgres:
    image: postgres:16
    container_name: legalease-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: legalease
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - legalease_pgdata:/var/lib/postgresql/data

volumes:
  legalease_pgdata:
